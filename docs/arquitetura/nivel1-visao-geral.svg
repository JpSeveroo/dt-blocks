<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 800" width="1560" height="800" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1E293B"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#15803D"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <filter id="shadow-central" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16A34A" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Fundo Geral -->
  <rect x="0" y="0" width="1560" height="800" fill="#FFFFFF"/>
  <rect x="12" y="12" width="1536" height="776" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Título -->
  <text x="780" y="50" text-anchor="middle" font-size="23" font-weight="700" fill="#0F172A">DT-Blocks 2.0 — Nível 1: Visão Geral da Arquitetura e Implantação</text>

  <!-- ======================================================================= -->
  <!-- FRONTEIRA 1: MÁQUINA DO PARTICIPANTE -->
  <!-- ======================================================================= -->
  <rect x="40" y="95" width="300" height="550" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="60" y="82" width="215" height="26" rx="6" fill="#334155"/>
  <text x="167" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.7">MÁQUINA DO PARTICIPANTE</text>

  <!-- Participantes -->
  <g filter="url(#shadow)">
    <rect x="75" y="160" width="230" height="105" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <circle cx="190" cy="193" r="15" fill="#2563EB"/>
    <circle cx="190" cy="188" r="5.5" fill="#FFFFFF"/>
    <path d="M 180 203 C 180 196, 200 196, 200 203" fill="#FFFFFF"/>
    <text x="190" y="230" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1E3A8A">Participantes</text>
    <text x="190" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#1D4ED8">[Editores e Leitores]</text>
  </g>

  <!-- Seta Participantes -> Navegador -->
  <line x1="190" y1="265" x2="190" y2="352" stroke="#1E293B" stroke-width="2.2" marker-end="url(#arrow-solid)"/>
  <polygon points="190,359 184,347 196,347" fill="#1E293B"/>

  <!-- Navegador -->
  <g filter="url(#shadow)">
    <rect x="75" y="360" width="230" height="115" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="190" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A8A">Navegador</text>
    <text x="190" y="436" text-anchor="middle" font-size="13" font-weight="600" fill="#1D4ED8">[React · TypeScript]</text>
  </g>


  <!-- ======================================================================= -->
  <!-- FRONTEIRA 2: VPS -->
  <!-- ======================================================================= -->
  <rect x="465" y="95" width="660" height="550" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="485" y="82" width="120" height="26" rx="6" fill="#334155"/>
  <text x="545" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.7">VPS (LINUX)</text>

  <!-- Nó de Infraestrutura: SSH -->
  <g filter="url(#shadow)">
    <rect x="865" y="135" width="225" height="80" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="977" y="171" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">Serviço SSH</text>
    <text x="977" y="194" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">[OpenSSH]</text>
  </g>

  <!-- Sub-fronteira: Docker Compose -->
  <rect x="495" y="280" width="600" height="340" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="512" y="268" width="142" height="24" rx="5" fill="#475569"/>
  <text x="583" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.6">DOCKER COMPOSE</text>

  <!-- Nginx -->
  <g filter="url(#shadow)">
    <polygon points="545,360 685,360 705,418 685,476 545,476 525,418" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2.5"/>
    <text x="615" y="413" text-anchor="middle" font-size="18" font-weight="700" fill="#312E81">Nginx</text>
    <text x="615" y="437" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4338CA">[Proxy Reverso]</text>
  </g>

  <!-- Processo FastAPI (Decisão Central) -->
  <g filter="url(#shadow-central)">
    <rect x="805" y="360" width="260" height="116" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="3.5"/>
    <rect x="830" y="347" width="210" height="22" rx="5" fill="#15803D"/>
    <text x="935" y="362" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">★ 1 WORKER · MEMÓRIA</text>

    <text x="935" y="410" text-anchor="middle" font-size="18" font-weight="700" fill="#14532D">Processo FastAPI</text>
    <text x="935" y="436" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">[Python · FastAPI · Uvicorn · Pydantic]</text>
  </g>

  <!-- Persistência Embarcada: SQLite (modo WAL) -->
  <g filter="url(#shadow)">
    <path d="M 805,532 L 805,592 A 130,14 0 0,0 1065,592 L 1065,532 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
    <ellipse cx="935" cy="532" rx="130" ry="14" fill="#FDE68A" stroke="#D97706" stroke-width="2.5"/>
    <text x="935" y="565" text-anchor="middle" font-size="16" font-weight="700" fill="#78350F">SQLite (modo WAL)</text>
    <text x="935" y="585" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400E">[Banco Embarcado · Arquivo em Volume]</text>
  </g>


  <!-- ======================================================================= -->
  <!-- FRONTEIRA 3: FORA DA VPS -->
  <!-- ======================================================================= -->
  <rect x="1245" y="95" width="275" height="550" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="1265" y="82" width="150" height="26" rx="6" fill="#334155"/>
  <text x="1340" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.7">FORA DA VPS</text>

  <!-- Coletor externo -->
  <g filter="url(#shadow)">
    <rect x="1272" y="135" width="220" height="80" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1382" y="171" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Coletor externo</text>
    <text x="1382" y="194" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">[Python / UNAME Tool]</text>
  </g>

  <!-- Monitor externo -->
  <g filter="url(#shadow)">
    <rect x="1272" y="255" width="220" height="80" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1382" y="291" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Monitor externo</text>
    <text x="1382" y="314" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">[Monitoramento Externo]</text>
  </g>

  <!-- Backup diário -->
  <g filter="url(#shadow)">
    <rect x="1272" y="522" width="220" height="80" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1382" y="558" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Backup diário</text>
    <text x="1382" y="581" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">[Armazenamento Externo]</text>
  </g>


  <!-- ======================================================================= -->
  <!-- LIGAÇÕES (RÓTULOS CURTOS E DIRETOS, SEM CRUZAMENTOS) -->
  <!-- ======================================================================= -->

  <!-- 1. Navegador -> Nginx -->
  <line x1="305" y1="418" x2="518" y2="418" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arrow-solid)"/>
  <polygon points="525,418 513,412 513,424" fill="#1E293B"/>
  <rect x="345" y="382" width="135" height="26" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="412" y="399" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F172A">HTTPS / WebSocket</text>

  <!-- 2. Nginx -> Processo FastAPI -->
  <line x1="705" y1="418" x2="798" y2="418" stroke="#15803D" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <polygon points="805,418 793,412 793,424" fill="#15803D"/>
  <rect x="708" y="382" width="92" height="26" rx="5" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="754" y="399" text-anchor="middle" font-size="11" font-weight="700" fill="#14532D">HTTP / WS</text>

  <!-- 3. Processo FastAPI -> SQLite (modo WAL) -->
  <line x1="935" y1="476" x2="935" y2="511" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arrow-solid)"/>
  <polygon points="935,518 929,506 941,506" fill="#1E293B"/>
  <rect x="948" y="485" width="118" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1007" y="500" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">Escrita em lote</text>

  <!-- 4. Coletor externo -> Serviço SSH -->
  <line x1="1272" y1="175" x2="1097" y2="175" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <polygon points="1090,175 1102,169 1102,181" fill="#475569"/>
  <rect x="1112" y="139" width="142" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1183" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">SSH (CSV / JSON)</text>

  <!-- 5. Monitor externo -> Nginx (desce em x=675, livre do selo DOCKER COMPOSE) -->
  <path d="M 1272,295 L 1185,295 L 1185,242 L 675,242 L 675,353" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <polygon points="675,360 669,348 681,348" fill="#475569"/>
  <rect x="850" y="229" width="160" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="930" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">HTTPS (disponibilidade)</text>

  <!-- 6. SQLite (modo WAL) -> Backup diário -->
  <line x1="1065" y1="562" x2="1265" y2="562" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <polygon points="1272,562 1260,556 1260,568" fill="#475569"/>
  <rect x="1105" y="527" width="135" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1172" y="544" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Cópia criptografada</text>


  <!-- ======================================================================= -->
  <!-- LEGENDA COMPACTA -->
  <!-- ======================================================================= -->
  <rect x="40" y="672" width="1480" height="94" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.8"/>
  <text x="65" y="696" font-size="13" font-weight="700" fill="#0F172A" letter-spacing="0.5">LEGENDA</text>
  <line x1="65" y1="704" x2="1495" y2="704" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- Item 1: Processo Único -->
  <rect x="65" y="720" width="34" height="24" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
  <text x="108" y="737" font-size="12" font-weight="700" fill="#14532D">Processo Único (Memória)</text>

  <!-- Item 2: Aplicação / Participante -->
  <rect x="295" y="720" width="34" height="24" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="338" y="737" font-size="12" font-weight="700" fill="#1E3A8A">Participante / Aplicação</text>

  <!-- Item 3: Proxy Reverso -->
  <polygon points="518,720 542,720 548,732 542,744 518,744 512,732" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="558" y="737" font-size="12" font-weight="700" fill="#312E81">Proxy Reverso</text>

  <!-- Item 4: Persistência em Arquivo -->
  <path d="M 675,726 L 675,742 A 17,4 0 0,0 709,742 L 709,726 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <ellipse cx="692" cy="726" rx="17" ry="4" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="720" y="737" font-size="12" font-weight="700" fill="#78350F">Banco Embarcado (WAL)</text>

  <!-- Item 5: Infraestrutura VPS -->
  <rect x="900" y="720" width="34" height="24" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="943" y="737" font-size="12" font-weight="700" fill="#1E293B">Infraestrutura da VPS</text>

  <!-- Item 6: Externo / Fronteira -->
  <rect x="1105" y="720" width="34" height="24" rx="5" fill="#F1F5F9" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="1148" y="737" font-size="12" font-weight="700" fill="#334155">Serviço Externo / Fronteira</text>

  <!-- Item 7: Setas -->
  <line x1="1335" y1="725" x2="1368" y2="725" stroke="#1E293B" stroke-width="2.2"/>
  <polygon points="1374,725 1365,720 1365,730" fill="#1E293B"/>
  <text x="1382" y="729" font-size="11.5" font-weight="700" fill="#0F172A">Tempo Real / Local</text>

  <line x1="1335" y1="742" x2="1368" y2="742" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="1374,742 1365,737 1365,747" fill="#475569"/>
  <text x="1382" y="746" font-size="11.5" font-weight="700" fill="#334155">Fluxo Externo</text>
</svg>
